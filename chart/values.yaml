# -----------------------------------------------------------------------------
# Mirrorgate Helm values
# -----------------------------------------------------------------------------
# Override these in your env-specific values file. Anything left empty here is
# either optional or expected to come from an out-of-band Kubernetes Secret.
# -----------------------------------------------------------------------------

# Number of replicas. Mirrorgate keeps the live job queue in-memory and appends
# history to a single file on the data volume, so >1 replicas both split the
# queue and interleave writes to that file. Keep this at 1.
replicaCount: 1

image:
  repository: ""          # e.g. registry.example.com/devops/mirrorgate
  tag: ""                 # e.g. v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
  # - name: registry-pull-secret

# -----------------------------------------------------------------------------
# Destination registry (required)
# -----------------------------------------------------------------------------
# The host Mirrorgate copies INTO. Skopeo will push to "{host}/{image}:{tag}".
nexus:
  host: ""                # e.g. registry.example.com  (required)
  user: ""                # username for the destination registry
  # Password is read from an existing Secret, NOT from values.yaml. Create it
  # out of band:
  #   kubectl create secret generic mirrorgate-nexus \
  #     --from-literal=NEXUS_PASS='...'
  passwordSecret:
    name: ""              # name of the Secret holding the password
    key: NEXUS_PASS       # key inside the Secret

# -----------------------------------------------------------------------------
# API authentication (optional)
# -----------------------------------------------------------------------------
# If apiKeySecret.name is set, requests to /api/* must send X-API-Key.
# If left empty, the API is open inside the cluster.
apiKeySecret:
  name: ""                # e.g. mirrorgate-api
  key: API_KEY

# -----------------------------------------------------------------------------
# Browser authentication (optional)
# -----------------------------------------------------------------------------
# If basicAuthSecret.name is set, the UI ("/" and "/ui/*") prompts for HTTP
# Basic Auth with a single user/password pulled from the named Secret.
# /health and /api/* are NOT gated by Basic Auth (kubelet probes + CI use
# X-API-Key). If left empty, the UI is open.
#
# Create the Secret out of band, e.g.:
#   kubectl create secret generic mirrorgate-secrets \
#     --from-literal=BASIC_AUTH_USER='admin' \
#     --from-literal=BASIC_AUTH_PASS='...'
basicAuthSecret:
  name: ""                # e.g. mirrorgate-secrets
  userKey: BASIC_AUTH_USER
  passKey: BASIC_AUTH_PASS

# -----------------------------------------------------------------------------
# Outbound proxy (optional)
# -----------------------------------------------------------------------------
# Set this if pulls to public registries have to traverse a corporate proxy.
corporateProxy: ""        # e.g. http://proxy.example.com:8080

# Extra hosts that should bypass the proxy. NEXUS_REGISTRY, localhost and
# 127.0.0.1 are added automatically.
noProxyExtra: ""          # e.g. .internal,.local

# -----------------------------------------------------------------------------
# App tuning
# -----------------------------------------------------------------------------
config:
  port: 8080
  workers: 3
  # Jobs kept in history. Two lines are appended per job and the file is
  # compacted at 4x this, so a 500-job history settles around 1-2MB.
  historySize: 500
  healthCheckInterval: 30
  # Characters of skopeo output stored per job. Credentials are passed to
  # skopeo in argv and never appear in its output, so the tail holds no secret.
  logTailChars: 4000

# -----------------------------------------------------------------------------
# Job history storage
# -----------------------------------------------------------------------------
# Mirrorgate writes job history (source, destination, result, timestamps and
# the pushed manifest digest) to DATA_DIR as JSONL and reloads it on start.
#
# With persistence disabled the app still runs, but every restart wipes the
# history - which is what it did before v3.3.0.
persistence:
  enabled: true
  # ALWAYS set this explicitly. Leaving it unset binds to the cluster default
  # storage class, and on the ANB clusters that is `thin`, the in-tree vSphere
  # provisioner - the same setup behind the nine-day stuck detach in July 2026,
  # where vCenter would not release the volume and the pod could not reschedule.
  # CephFS needs no detach at all.
  storageClassName: ocs-storagecluster-cephfs
  # RWX so the volume never has to be detached from a node to move the pod.
  # replicaCount stays 1 regardless - this is about rescheduling, not scale.
  accessMode: ReadWriteMany
  size: 2Gi
  mountPath: /data
  # Bind an existing claim instead of creating one. Use this when migrating
  # from a volume that already holds history.jsonl.
  existingClaim: ""

# -----------------------------------------------------------------------------
# Kubernetes / OpenShift wiring
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# OpenShift Route. Set enabled=true on OCP, leave false on plain Kubernetes
# and use an Ingress (not shipped with this chart yet).
openshift:
  route:
    enabled: false
    host: ""              # e.g. mirrorgate.apps.example.com (optional)
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

serviceAccount:
  create: true
  name: ""                # leave empty to use <release>-mirrorgate

podSecurityContext: {}

securityContext: {}
  # OpenShift assigns a random UID at runtime. Leaving this empty lets the
  # platform pick. On plain Kubernetes you may want:
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables passed through to the container.
extraEnv: []
  # - name: SOME_FLAG
  #   value: "true"
